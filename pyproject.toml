[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbank-myt-mcp"
version = "0.1.0"
description = "MCP для MyT — рабочего календаря и офисной парковки Т-Банка"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  # 1.x: FastMCP живёт в mcp.server.fastmcp. В 2.0 этого модуля нет.
  "mcp>=1.2,<2",
  "requests>=2.32",
]

[project.scripts]
tbank-myt-mcp = "tbank_myt.server:main"
# Вход ставится вместе с пакетом: на него ссылается каждый ответ про мёртвую сессию.
tbank-myt-login = "tbank_myt.login:main"

[tool.setuptools]
# Имя пакета — tbank_myt, а не src. Соседний банковский MCP тоже ставит «src», и в
# одном venv они затирают друг друга по файлу: проверено — остаётся один каталог со
# смесью обоих, и MyT начинает импортировать чужой server.py. Приколотый корень
# лежит ВНУТРИ пакета по той же причине: общего каталога «ca» на двоих быть не должно.
packages = ["tbank_myt"]

[tool.setuptools.package-data]
tbank_myt = ["ca/roots/*.pem"]
